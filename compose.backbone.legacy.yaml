# Overlay for deployed exit releases whose Compose file predates the in-container
# WireGuard/FRR backbone mount and UDP ports. Apply with the release's compose.yaml.
services:
  server:
    ports:
      - "0.0.0.0:51820:51820/udp"
      - "0.0.0.0:51821:51821/udp"
    tmpfs:
      - /run/gamebond-backbone:rw,noexec,nosuid,size=4m,mode=0700
      - /run/frr:rw,noexec,nosuid,size=2m,mode=0755
      - /var/tmp/frr:rw,noexec,nosuid,size=2m,mode=0770,uid=0,gid=102
    volumes:
      - type: bind
        source: ./secrets/backbone
        target: /run/secrets/gamebond-backbone
        read_only: true
        bind:
          create_host_path: false
