name: server-image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: shell scripts parse
        run: bash -n tools/server-probe.sh && bash -n tools/container-entrypoint.sh && bash tools/test-probe.sh
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...
  image:
    # The probe on the VPS deploys whatever this job publishes from main, so it only runs once the tests pass.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/dankular/gamebond-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
